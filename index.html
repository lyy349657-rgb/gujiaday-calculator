<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>816顾家日自动算价器</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f6f9; margin: 0; padding: 12px; color: #333; }
        .card { background: #fff; border-radius: 10px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { color: #d93025; font-size: 18px; margin-top: 0; border-bottom: 2px solid #fee; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; }
        .checkbox-group input { width: 18px; height: 18px; }
        .calc-btn { width: 100%; background: #d93025; color: #fff; border: none; padding: 14px; font-size: 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .result-box { background: #fff0f0; border: 1px dashed #d93025; padding: 12px; border-radius: 6px; margin-top: 15px; display: none; }
        .price-tag { font-size: 28px; color: #d93025; font-weight: bold; text-align: center; margin: 8px 0; }
        .tip { font-size: 12px; color: #888; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🛋️ 816顾家日 - 快速算价神器</h2>
    
    <div class="form-group">
        <label>🔍 输入产品型号 / 货号 (多个型号用空格或逗号隔开)：</label>
        <input type="text" id="searchInput" placeholder="例：B1075 M0190 或 15816" value="">
        <div class="tip">提示：直接输入货号中的数字或字母（如 1075、S8、0190）即可自动查找算价。</div>
    </div>

    <div class="form-group" style="border-top: 1px dashed #eee; padding-top: 10px;">
        <label>🎁 附加活动优惠选择：</label>
        <div class="checkbox-group">
            <input type="checkbox" id="hasSofa">
            <label for="hasSofa">已买沙发（卧室床+床垫享连带优惠立减250元）</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="opt_1999">
            <label for="opt_1999">+1999元 换购家品7件套</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="opt_1199">
            <label for="opt_1199">+1199元 换购夏日凉感8件套</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="opt_1399">
            <label for="opt_1399">+1399元 换购G061真皮小柜一对</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="opt_399">
            <label for="opt_399">+399元 换购PTW3002G床头柜</label>
        </div>
    </div>

    <button class="calc-btn" onclick="startCalculate()">一键自动算价</button>

    <div class="result-box" id="resultBox">
        <div style="text-align:center; font-size: 13px; color:#666;">顾客最终到手预估价</div>
        <div class="price-tag">¥ <span id="finalPrice">0</span></div>
        <div id="detailText" style="font-size: 13px; color: #444; line-height: 1.6;"></div>
    </div>
</div>

<script>
// 基础数据库
var db = [
    { code: "B1075PQ3", name: "云梦床架/套餐", price: 14999, cut: true },
    { code: "M0190", name: "3D全撑X5床垫", price: 5999, cut: true },
    { code: "ZX.M0580Z", name: "S系列S8智能床垫", price: 17999, cut: true },
    { code: "ZX.M0560Z", name: "S系列S6智能床垫", price: 17999, cut: true },
    { code: "ZX.M0331D.M26", name: "星舟1号Pro智能套床", price: 16999, cut: true },
    { code: "M1007A", name: "纯3D床垫(IDeep)", price: 40999, cut: true },
    { code: "M1821", name: "伊甸(IDeep)", price: 21999, cut: true },
    { code: "M1812", name: "传奇大满贯(IDeep)", price: 23999, cut: true },
    { code: "M0578", name: "礼玉(IDeep)", price: 18999, cut: true },
    { code: "M1813", name: "科莫(IDeep)", price: 18999, cut: true },
    { code: "M0188P", name: "王牌3D床垫", price: 11399, cut: true },
    { code: "M0577Pro", name: "M0577Pro换新主推床垫", price: 5999, cut: true },
    { code: "JD.M1012.M26", name: "新婚垫&孝心垫", price: 4999, cut: true },
    { code: "JD.M1015.H24", name: "M3001升级款床垫", price: 3999, cut: true },
    { code: "B1085PQ3", name: "珀斯床架", price: 13999, cut: true },
    { code: "B1855PQ1", name: "花瓣床架", price: 8999, cut: true },
    { code: "B553PQ1", name: "云谣床架", price: 8599, cut: true },
    { code: "JD.B036PQ3", name: "抱抱床架", price: 7599, cut: true },
    { code: "B1065PQ3", name: "蓝山床架", price: 7599, cut: true },
    { code: "BY.B260PQ1", name: "B260床架", price: 5999, cut: true },
    { code: "B553PQ1/M1010", name: "抱抱/蓝山 爆款单卧套餐", price: 9999, cut: false },
    { code: "B1065PQ3/M1012", name: "云梦/云谣 爆款单卧套餐", price: 10999, cut: false },
    { code: "DZ.B033PQ1", name: "高性价比DZ.B033PQ1床架", price: 3816, cut: false },
    { code: "B1856PQ1+BY.M2818", name: "夺冠套餐", price: 8999, cut: false },
    { code: "DZ.B033PQ1+M0320D", name: "轻雅套餐", price: 4999, cut: false },
    { code: "15816", name: "15816元夺冠双厅单卧套餐", price: 15816, cut: false },
    { code: "13816", name: "13816元智睡双卧套餐", price: 13816, cut: false },
    { code: "9816", name: "9816元王牌双卧套餐", price: 9816, cut: false }
];

function startCalculate() {
    var rawInput = document.getElementById('searchInput').value.trim();
    if (!rawInput) {
        alert("请输入产品型号或货号！");
        return;
    }

    // 分割输入的关键字
    var keywords = rawInput.toUpperCase().split(/[\s,，]+/);
    var matchedItems = [];
    var notFound = [];

    for (var i = 0; i < keywords.length; i++) {
        var kw = keywords[i];
        if (!kw) continue;
        
        var found = false;
        for (var j = 0; j < db.length; j++) {
            if (db[j].code.toUpperCase().indexOf(kw) !== -1 || db[j].name.toUpperCase().indexOf(kw) !== -1) {
                matchedItems.push(db[j]);
                found = true;
                break;
            }
        }
        if (!found) {
            notFound.push(kw);
        }
    }

    if (matchedItems.length === 0) {
        alert("未能识别输入的型号：[" + notFound.join(", ") + "]，请检查是否拼写正确。");
        return;
    }

    var cutTotal = 0;
    var noCutTotal = 0;
    var details = [];

    for (var k = 0; k < matchedItems.length; k++) {
        var item = matchedItems[k];
        if (item.cut) {
            cutTotal += item.price;
        } else {
            noCutTotal += item.price;
        }
        details.push("【已匹配】" + item.name + " (" + item.code + "): ¥" + item.price);
    }

    if (notFound.length > 0) {
        details.push("<span style='color:red;'>【未找到】" + notFound.join(", ") + "</span>");
    }

    // 沙发立减250
    if (document.getElementById('hasSofa').checked && cutTotal > 0) {
        cutTotal -= 250;
        details.push("沙发连带卧室优惠：-¥250");
    }

    // 满5000减500
    var fullCut = 0;
    if (cutTotal >= 5000) {
        fullCut = Math.floor(cutTotal / 5000) * 500;
    }

    var finalPrice = (cutTotal - fullCut) + noCutTotal;
    if (fullCut > 0) {
        details.push("全场满5000减500优惠：-¥" + fullCut);
    }

    // 换购
    if (document.getElementById('opt_1999').checked) { finalPrice += 1999; details.push("换购家品7件套：+¥1999"); }
    if (document.getElementById('opt_1199').checked) { finalPrice += 1199; details.push("换购夏日凉感8件套：+¥1199"); }
    if (document.getElementById('opt_1399').checked) { finalPrice += 1399; details.push("换购真皮小柜：+¥1399"); }
    if (document.getElementById('opt_399').checked) { finalPrice += 399; details.push("换购床头柜：+¥399"); }

    document.getElementById('finalPrice').innerText = finalPrice;
    document.getElementById('detailText').innerHTML = "<b>算价明细：</b><br>" + details.join("<br>");
    document.getElementById('resultBox').style.display = 'block';
}
</script>
</body>
</html>
