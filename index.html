        .price-tag { font-size: 28px; color: #d93025; font-weight: bold; text-align: center; margin: 8px 0; }

        return;
    }

    // 搜索词过滤（剥离标点符号与空格）
    var cleanKw = rawKw.replace(/[\s\.\-_/]/g, '').toUpperCase();

    var results = [];
    for (var i = 0; i < db.length; i++) {
        var cleanCode = db[i].code.replace(/[\s\.\-_/]/g, '').toUpperCase();
        var cleanName = db[i].name.replace(/[\s\.\-_/]/g, '').toUpperCase();
        if (cleanCode.indexOf(cleanKw) !== -1 || cleanName.indexOf(cleanKw) !== -1) {
            results.push(db[i]);
        }
    }

    if (results.length === 0) {
        matchList.innerHTML = '<div style="font-size:12px; color:#999; padding:8px;">未找到匹配的产品，请检查搜索词</div>';
    } else {
        var html = '';
        for (var j = 0; j < results.length; j++) {
            var item = results[j];
            var typeTag = '<span class="tag tag-blue">' + item.type + '</span>';
            var cutTag = item.cut ? '<span class="tag tag-green">参与满5000-500</span>' : '<span class="tag tag-gray">一口价/不参与满减</span>';
            html += '<div class="match-item">' +
                        '<div class="match-info">' +
                            '<strong>' + item.name + '</strong> ' + typeTag + cutTag + '<br>' +
                            '货号: ' + item.code + ' | 方案价: ¥' + item.price +
                        '</div>' +
                        '<button class="add-btn" onclick="addToCart(' + item.id + ')">+ 添加</button>' +
                    '</div>';
        }
        matchList.innerHTML = html;
    }
    matchSec.style.display = 'block';
}

function addToCart(id) {
    for (var i = 0; i < db.length; i++) {
        if (db[i].id === id) {
            selectedCart.push(db[i]);
            break;
        }
    }
    renderCart();
}

function removeFromCart(index) {
    selectedCart.splice(index, 1);
    renderCart();
}

function renderCart() {
    var list = document.getElementById('selectedList');
    if (selectedCart.length === 0) {
        list.innerHTML = '<div style="font-size: 12px; color: #999; text-align: center; padding: 10px; background:#f9f9f9; border-radius:4px;">请在上方搜索并点击【添加】产品</div>';
        return;
    }

    var html = '';
    for (var i = 0; i < selectedCart.length; i++) {
        var item = selectedCart[i];
        html += '<div class="selected-item">' +
                    '<div><b>' + item.name + '</b> (' + item.code + ') - ¥' + item.price + '</div>' +
                    '<button class="del-btn" onclick="removeFromCart(' + i + ')">×</button>' +
                '</div>';
    }
    list.innerHTML = html;
}

function startCalculate() {
    if (selectedCart.length === 0) {
        alert("请先搜索并点击【添加】至少一件商品！");
        return;
    }

    var cutTotal = 0;
    var noCutTotal = 0;
    var details = [];
    var has1075 = false;
    var has0190 = false;
    var hasSofaInCart = false;
    var hasPT3710T = false;

    for (var i = 0; i < selectedCart.length; i++) {
        var item = selectedCart[i];
        if (item.code === "B1075PQ3") has1075 = true;
        if (item.code === "M0190") has0190 = true;
        if (item.type.indexOf("沙发") !== -1 || item.name.indexOf("沙发") !== -1) hasSofaInCart = true;
        if (item.code === "PT3710T") hasPT3710T = true;

        if (item.cut) {
            cutTotal += item.price;
        } else {
            noCutTotal += item.price;
        }
        details.push("【已选】" + item.name + " (" + item.code + "): ¥" + item.price);
    }

    // 专项优惠 1: OMO 1075 + 0190 组合减1000
    var omoDiscount = 0;
    if (has1075 && has0190) {
        omoDiscount = 1000;
        details.push("<span style='color:#d93025;font-weight:bold;'>触发优惠：云梦床架+0190床垫 组合立减 -¥1000</span>");
    }

    // 专项优惠 2: 买沙发连带 PT3710T餐桌 减1000
    var diningDiscount = 0;
    if (hasSofaInCart && hasPT3710T) {
        diningDiscount = 1000;
        details.push("<span style='color:#d93025;font-weight:bold;'>触发优惠：买沙发连带PT3710T餐桌立减 -¥1000</span>");
    }

    // 专项优惠 3: 客卧连带立减500元
    var sofaDiscount = 0;
    if (document.getElementById('hasSofa').checked || hasSofaInCart) {
        sofaDiscount = 500;
        details.push("触发优惠：沙发连带卧室空间立减 -¥500");
    }

    // 常规全场满5000减500
    var fullCut = 0;
    if (cutTotal >= 5000) {
        fullCut = Math.floor(cutTotal / 5000) * 500;
        details.push("触发优惠：全场实付满5000立减 -¥" + fullCut);
    }

    var finalPrice = (cutTotal - fullCut) + noCutTotal - omoDiscount - diningDiscount - sofaDiscount;

    // 换购加价
    if (document.getElementById('opt_399_motion').checked) { finalPrice += 399; details.push("升级加价：功能沙发升级双电动 +¥399"); }
    if (document.getElementById('opt_399_massage').checked) { finalPrice += 399; details.push("升级加价：功能沙发升级按摩功能 +¥399"); }
    if (document.getElementById('opt_1999_island').checked) { finalPrice += 1999; details.push("换购加价：PT3278KC岛台 +¥1999"); }
    if (document.getElementById('opt_1999_house').checked) { finalPrice += 1999; details.push("换购加价：家品7件套 +¥1999"); }
    if (document.getElementById('opt_1199').checked) { finalPrice += 1199; details.push("换购加价：夏日凉感8件套 +¥1199"); }
    if (document.getElementById('opt_1399').checked) { finalPrice += 1399; details.push("换购加价：G061真皮小柜一对 +¥1399"); }
    if (document.getElementById('opt_399_table').checked) { finalPrice += 399; details.push("换购加价：PTW3002G床头柜 +¥399"); }

    document.getElementById('finalPrice').innerText = finalPrice;
    document.getElementById('detailText').innerHTML = "<b>报价明细与优惠应用：</b><br>" + details.join("<br>");
    document.getElementById('resultBox').style.display = 'block';
}
</script>
