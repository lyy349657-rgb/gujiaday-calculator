let selectedCart = [];

function searchProduct() {
    const query = document.getElementById('searchInput').value.trim().toUpperCase();
    const resultsBox = document.getElementById('searchResults');
    
    if (!query) {
        resultsBox.style.display = 'none';
        return;
    }

    // 模糊匹配货号或名称[cite: 1]
    const matches = db.filter(item => 
        item.code.toUpperCase().includes(query) || 
        item.name.toUpperCase().includes(query)
    );

    if (matches.length === 0) {
        resultsBox.innerHTML = '<div class="search-item" style="color:#999;">未找到匹配型号，请检查货号输入</div>';
    } else {
        resultsBox.innerHTML = matches.map((item, index) => `
            <div class="search-item" onclick="addItem('${item.code}')">
                <div><strong>${item.name}</strong> <span class="tag ${item.allowFullCut?'tag-red':''}">${item.allowFullCut?'满减支持':'一口价特价'}</span></div>
                <div style="color:#666; font-size:12px;">货号/代码: ${item.code} | 活动价: ¥${item.price} (${item.remark})</div>
            </div>
        `).join('');
    }
    resultsBox.style.display = 'block';
}

函数 addItem(代码) {
    const 项目 = 数据库.查询(条件 => 条件.代码 === 代码);
    如果 (商品) {
        selectedCart.push(商品);
        renderCart();
        document.getElementById('searchInput').value = '';
        document.getElementById('searchResults').style.display = 'none';
    }
}

function removeItem(index) {
    selectedCart.splice(index, 1);
    renderCart();
}

function renderCart() {
    const list = document.getElementById('selectedList');
    if (selectedCart.length === 0) {
        list.innerHTML = '<div style="font-size: 12px; color: #999; text-align: center; padding: 10px;">暂未选择产品，请在上方搜索添加</div>';
        return;
    }

    list.innerHTML = selectedCart.map((item, index) => `
        <div class="selected-card">
            <div class="selected-info">
                <strong>${item.name}</strong> (${item.code})<br>
                <span style="color:#d93025; font-weight:bold;">¥${item.price}</span> 
                <span class="tag">${item.allowFullCut ? '参与满5000减500':'一口价/不参与满减'}</span>
            </div>
            <button class="del-btn" onclick="removeItem(${index})">×</button>
        </div>
    `).join('');
}

function calculateTotal() {
    如果 (selectedCart.长度 === 0) {
        alert("请先在搜索框查找并添加至少一件产品或套餐！");
        返回;
    }

    let allowCutTotal = 0; // 参与满减的金额[cite: 1]
    let noCutTotal = 0;    // 不参与满减的特价一口价金额[cite: 1]
    let details = [];

    selectedCart.forEach(item => {
        如果 (item.allowFullCut) {
            allowCutTotal += item.price;
        } else {
            noCutTotal += item.price;
        }
        详情.push(`${item.name}: ¥${item.price}`);
    });

    // 检查沙发连带优惠 (-500)[引用: 1]
    const hasSofa = document.getElementById('hasSofa').checked;
    如果 (有沙发 && 允许切割总数 > 0) {
        allowCutTotal -= 500;
        details.push("沙发连带床垫优惠：-¥500[cite: 1]");
    }

    // 计算每满5000减500[cite: 1]
    let cutAmount = 0;
    如果 (allowCutTotal >= 5000) {
        cutAmount = Math.floor(allowCutTotal / 5000) * 500;
    }

    let finalTotal = (allowCutTotal - cutAmount) + noCutTotal;
    
    if (cutAmount > 0) {
        详情.推送(`满5000立减优惠：-¥${cutAmount}[引用：1]`);
    }

    // 加购项计算[cite: 1]
    如果 (document.getElementById('opt_jiaju1999').被选中) { 最终总额 += 1999; 详情.推入("换购家品7件套：+¥1999[引用: 1]"); }
    如果 (document.getElementById('opt_jiaju1199').被选中) { 最终总额 += 1199; 详情.推入("换购夏日凉感8件套：+¥1199[引用: 1]"); }
    如果 (document.getElementById('opt_cabinet1399').被选中) { 最终总额 += 1399; 详情.推入("换购G061真皮小柜：+¥1399[引用: 1]"); }
    如果 (document.getElementById('opt_desk399').被选中) { 最终总额 += 399; 详情.推入("换购床头柜：+¥399[引用: 1]"); }

    document.getElementById('finalPrice').innerText = finalTotal;
    document.getElementById('detailText').innerHTML = "<b>算价明细：</b><br>" + details.join("<br>");
    document.getElementById('resultBox').style.display = 'block';
}
